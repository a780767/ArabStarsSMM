<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArabStarsSMM - تطبيق SMM الشامل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🌟 ArabStarsSMM</h1>
                <p>منصة SMM المتكاملة</p>
            </div>
        </header>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>جاري التحميل...</p>
        </div>

        <!-- Main Content -->
        <div id="content" class="content" style="display: none;">
            <!-- Balance Card -->
            <div class="card balance-card">
                <h2>💰 رصيدك</h2>
                <div class="balance-amount" id="balance">0.00</div>
                <button class="btn btn-secondary" onclick="refreshBalance()">تحديث الرصيد</button>
            </div>

            <!-- Services Section -->
            <div class="card">
                <h2>📋 الخدمات المتاحة</h2>
                <div id="services" class="services-grid">
                    <div class="service-skeleton">جاري التحميل...</div>
                </div>
            </div>

            <!-- Order Form -->
            <div class="card">
                <h2>📝 طلب جديد</h2>
                <form id="orderForm" class="form">
                    <div class="form-group">
                        <label for="serviceId">اختر الخدمة:</label>
                        <select id="serviceId" required>
                            <option value="">-- اختر --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="link">الرابط:</label>
                        <input type="url" id="link" placeholder="https://example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">الكمية:</label>
                        <input type="number" id="quantity" min="1" max="100000" required>
                    </div>

                    <button type="submit" class="btn btn-primary">إرسال الطلب</button>
                </form>
            </div>

            <!-- Orders History -->
            <div class="card">
                <h2>📊 آخر الطلبات</h2>
                <div id="orders" class="orders-list">
                    <p class="empty">لا توجد طلبات حتى الآن</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
